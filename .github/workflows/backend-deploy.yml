name: Backend CI/CD Pipeline - GHCR to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: googleshift-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: owner
        run: echo "repo_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.repo_owner }}/googleshift-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit VPS Connection Secrets & TCP Reachability
        run: |
          echo "=== Auditing VPS Connection Credentials ==="
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ [FATAL] VPS_HOST secret is missing or empty in repository settings!"
            exit 1
          fi
          echo "✓ VPS Host secret: Configured"

          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ [FATAL] VPS_USER secret is missing or empty in repository settings!"
            exit 1
          fi
          echo "✓ VPS User secret: Configured"

          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ [FATAL] VPS_SSH_KEY secret is missing or empty in repository settings!"
            exit 1
          fi
          echo "✓ VPS SSH Key secret: Configured"

          TARGET_PORT="${{ secrets.VPS_PORT }}"
          if [ -z "$TARGET_PORT" ]; then
            TARGET_PORT="22"
          fi
          echo "✓ Target SSH Port: ${TARGET_PORT}"

          echo "Testing direct TCP reachability to VPS SSH endpoint..."
          if nc -zv -w 15 "${{ secrets.VPS_HOST }}" "$TARGET_PORT" 2>&1; then
            echo "✓ [PASS] Direct TCP Connection to VPS SSH endpoint succeeded!"
          else
            echo "⚠️ [WARN] Direct TCP probe timed out or failed. SSH action will attempt connection with 60s timeout."
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO_OWNER: ${{ steps.owner.outputs.repo_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,REPO_OWNER
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "=== Starting Production VPS Deployment ==="
            echo "Target Image SHA: ${IMAGE_TAG}"
            echo "Target Repository Owner: ${REPO_OWNER}"

            mkdir -p /var/www/googleshift
            cd /var/www/googleshift

            # Detect Docker Compose binary (Compose V2 plugin vs Compose V1 standalone)
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "❌ [FATAL] Neither 'docker compose' nor 'docker-compose' is installed on VPS!"
              exit 1
            fi

            echo "[1/6] Writing production Compose configuration on VPS..."
            cat << 'EOF' > docker-compose.yml
            services:
              backend:
                image: ghcr.io/${REPO_OWNER}/googleshift-backend:${IMAGE_TAG}
                container_name: googleshift-backend
                restart: unless-stopped
                env_file:
                  - .env
                ports:
                  - "3100:3100"
                healthcheck:
                  test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3100/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 15s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "5"
                environment:
                  - PORT=3100
                  - MANIFEST_STORAGE_PATH=/app/data/manifests
                volumes:
                  - googleshift_data:/app/data
                depends_on:
                  - redis
                networks:
                  - googleshift-network

              redis:
                image: redis:7-alpine
                container_name: googleshift-redis
                restart: unless-stopped
                command: redis-server --appendonly yes
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "5"
                volumes:
                  - redis_data:/data
                networks:
                  - googleshift-network

            networks:
              googleshift-network:
                name: googleshift-network
                external: true

            volumes:
              redis_data:
                driver: local
              googleshift_data:
                driver: local
            EOF

            # Substitute environment variables in docker-compose.yml
            sed -i "s/\${REPO_OWNER}/${REPO_OWNER}/g" docker-compose.yml
            sed -i "s/\${IMAGE_TAG}/${IMAGE_TAG}/g" docker-compose.yml

            echo "[2/6] Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            echo "[3/6] Pulling exact production container image tag..."
            docker pull "ghcr.io/${REPO_OWNER}/googleshift-backend:${IMAGE_TAG}"

            echo "[4/6] Recreating backend and redis services..."
            docker network create googleshift-network 2>/dev/null || true
            $COMPOSE_CMD up -d --force-recreate backend redis
            docker network connect googleshift-network googleshift-db 2>/dev/null || true

            echo "[5/6] Verifying database connectivity & executing migrations..."
            echo "Checking database DNS resolution..."
            docker exec googleshift-backend getent hosts googleshift-db
            echo "Checking database TCP connection..."
            docker exec googleshift-backend node -e "const net=require('net');const s=net.createConnection(5432,'googleshift-db');s.setTimeout(10000);s.on('connect',()=>{console.log('✓ Database TCP OK');s.end();process.exit(0);});s.on('error',e=>{console.error('❌ Database TCP error:',e.message);process.exit(1);});"

            sleep 2
            $COMPOSE_CMD exec -T backend npx prisma migrate deploy

            echo "[6/6] Pruning obsolete Docker images..."
            docker image prune -f

            echo "=== Verifying Backend Health Status ==="
            HEALTHCHECK_PASSED=0
            for i in $(seq 1 24); do
              RESPONSE=$(curl -fsS http://127.0.0.1:3100/health || true)
              if [ -n "$RESPONSE" ] && echo "$RESPONSE" | grep -q -E '"status":"(ok|degraded)"'; then
                HEALTHCHECK_PASSED=1
                echo "✓ [PASS] Backend healthcheck returned HTTP 200 OK!"
                echo "Health Diagnostics: $RESPONSE"
                break
              fi
              echo "Waiting for backend service startup... ($i/24)"
              if [ $((i % 3)) -eq 0 ]; then
                echo "--- Live Container Logs Snapshot ---"
                $COMPOSE_CMD logs --tail 30 backend || true
              fi
              sleep 5
            done

            if [ $HEALTHCHECK_PASSED -eq 0 ]; then
              echo "❌ [FATAL] Healthcheck failed after 120s! Running Diagnostics:"
              echo "--- Container Process List ---"
              $COMPOSE_CMD ps || true
              echo "--- Container Logs (Tail 200) ---"
              $COMPOSE_CMD logs --tail 200 backend || true
              exit 1
            fi

            echo "=== VPS Deployment Successfully Completed ==="
