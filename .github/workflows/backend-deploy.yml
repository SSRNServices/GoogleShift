name: Backend CI/CD Pipeline - GHCR to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: owner
        run: echo "repo_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.repo_owner }}/googleshift-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Production Docker Compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/docker-compose.yml"
          target: "/var/www/googleshift"
          strip_components: 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            echo "=== Starting Production VPS Deployment ==="
            
            mkdir -p /var/www/googleshift
            cd /var/www/googleshift

            # Verify docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ [FATAL] docker-compose.yml is missing in /var/www/googleshift!"
              exit 1
            fi

            # Detect Docker Compose binary (Compose V2 plugin vs Compose V1 standalone)
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "❌ [FATAL] Neither 'docker compose' nor 'docker-compose' is installed on VPS!"
              exit 1
            fi
            echo "Using Compose binary: $COMPOSE_CMD"

            echo "[1/4] Logging in to GitHub Container Registry..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true

            echo "[2/4] Pulling latest production container image..."
            $COMPOSE_CMD pull

            echo "[3/4] Starting container services..."
            $COMPOSE_CMD up -d

            echo "[4/4] Pruning obsolete Docker images..."
            docker image prune -f

            echo "=== Verifying Backend Health Status ==="
            echo "Allowing 10s for database connection & Express server boot..."
            sleep 10

            HEALTHCHECK_PASSED=0
            for i in $(seq 1 12); do
              if curl -sf http://127.0.0.1:3100/health | grep -q '"status":"ok"'; then
                HEALTHCHECK_PASSED=1
                echo "✓ [PASS] Backend healthcheck returned HTTP 200 OK!"
                break
              fi
              echo "Waiting for backend service startup... ($i/12)"
              sleep 5
            done

            if [ $HEALTHCHECK_PASSED -eq 0 ]; then
              echo "❌ [FATAL] Healthcheck failed after 70s! Container logs:"
              docker logs --tail 50 googleshift-backend
              exit 1
            fi

            echo "=== VPS Deployment Successfully Completed ==="
