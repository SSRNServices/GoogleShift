name: Backend CI/CD Pipeline - GHCR to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: googleshift-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: owner
        run: echo "repo_owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.repo_owner }}/googleshift-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Starting Production VPS Deployment ==="
            
            cd /var/www/googleshift

            # Detect Docker Compose binary (Compose V2 plugin vs Compose V1 standalone)
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &>/dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "❌ [FATAL] Neither 'docker compose' nor 'docker-compose' is installed on VPS!"
              exit 1
            fi

            echo "[1/5] Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            echo "[2/5] Pulling latest production container image..."
            $COMPOSE_CMD pull

            echo "[3/5] Starting container services..."
            $COMPOSE_CMD up -d

            echo "[4/5] Executing database migrations (ONE-SHOT)..."
            $COMPOSE_CMD exec -T backend npx prisma migrate deploy

            echo "[5/5] Pruning obsolete Docker images..."
            docker image prune -f

            echo "=== Verifying Backend Health Status ==="
            HEALTHCHECK_PASSED=0
            for i in $(seq 1 24); do
              RESPONSE=$(curl -s http://127.0.0.1:3100/health || true)
              if [ -z "$RESPONSE" ]; then
                RESPONSE='{"status":"offline"}'
              fi
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                HEALTHCHECK_PASSED=1
                echo "✓ [PASS] Backend healthcheck returned HTTP 200 OK!"
                echo "Health Diagnostics: $RESPONSE"
                break
              fi
              echo "Waiting for backend service startup... ($i/24) Diagnostic: $RESPONSE"
              sleep 5
            done

            if [ $HEALTHCHECK_PASSED -eq 0 ]; then
              echo "❌ [FATAL] Healthcheck failed after 120s! Running Diagnostics:"
              echo "--- Container Process List ---"
              $COMPOSE_CMD ps || true
              echo "--- Container Logs (Tail 200) ---"
              $COMPOSE_CMD logs --tail 200 backend || true
              exit 1
            fi

            echo "=== VPS Deployment Successfully Completed ==="
